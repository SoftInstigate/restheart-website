# The v9 documentation menu. One source for the sidebar (_includes/docs-sidebar.html), the section
# label above each page title and the previous/next links at the bottom (_includes/docs-nav-context.html).
#
# A group with `items` is a flat list; a group with `sections` shows each section as a collapsible
# block, open on the page that belongs to it. An item can have:
#   children: nested items, shown indented under it
#   also:     URLs of pages that are not in the menu and belong to this item; on them the item is
#             highlighted and its section is open (e.g. the single upgrade guides under "Upgrading")
#   label:    instead of title/url, a small heading inside a section
# URLs are written without .html, as page.url without the extension.

