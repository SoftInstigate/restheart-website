<div
  class="docs-panel config-panel"
  x-data="interactiveDocs"
  x-show="isInitialized"
  data-bs-theme="dark"
>
  <div class="docs-panel__header docs-panel__header--static">
    <div>
      <h3 class="docs-panel__title">Configuration</h3>
      <p class="docs-panel__subtitle">The service and the admin token the examples on this page use</p>
    </div>
  </div>
  <div class="docs-panel__body">
  <div class="row g-3">
    <div class="col-md-3">
      <label>Client Type</label>
      <select
        x-model="clientType"
        @change="onClientTypeChange()"
        class="form-select"
      >
        <option value="all">Show All</option>
        <option value="curl">cURL</option>
        <option value="httpie">HTTPie</option>
        <option value="javascript">JavaScript</option>
      </select>
    </div>
    <div class="col-md-3">
      <label>Instance URL</label>
      <input
        type="text"
        x-model="instanceUrl"
        @input="onInputChange()"
        class="form-control"
        placeholder="https://your-service.ulabase.app"
      />
    </div>
    <div class="col-md-3">
      <label>Admin JWT</label>
      <input
        type="text"
        x-model="jwt"
        @input="onInputChange()"
        class="form-control"
        placeholder="JWT"
      />
    </div>

    <div class="col-md-3">
      <label>Root user password to set</label>
      <input
        type="text"
        style="text-security: disc; -webkit-text-security: disc"
        x-model="password"
        @input="onInputChange()"
        class="form-control"
        placeholder="root_user_password"
      />
    </div>
  </div>

  <div class="docs-panel__note">
    <p class="mb-0">
      Before using these examples, get an admin JWT from
      <a href="https://ulabase.com/?utm_source=restheart.org&utm_medium=docs&utm_content=root-user-config" target="_blank"
        >ulabase.com</a
      >, on the page of your service.
    </p>
  </div>

  <div class="docs-panel__actions">
    <span class="docs-panel__spacer"></span>
    <span class="docs-panel__hint">Saved in your browser</span>
    <button type="button" @click="clearValues()" class="docs-panel__btn">Clear</button>
  </div>
  </div>
</div>
