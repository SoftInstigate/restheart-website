<div
  class="docs-panel config-panel"
  x-data="interactiveDocs"
  x-show="isInitialized"
  data-bs-theme="dark"
>
  <style>
    /* Prevent flash of content on page load */
    #configContent { visibility: hidden; }
    #configContent.collapse-ready { visibility: visible; }
  </style>
  <script>
    // Remember collapse state - run immediately to prevent FOUC
    (function () {
      const isCollapsed =
        localStorage.getItem("configPanelCollapsed") === "true";

      // Apply state immediately when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initCollapseState);
      } else {
        initCollapseState();
      }

      function initCollapseState() {
        const configContent = document.getElementById("configContent");
        const configHeader = document.querySelector(".config-header");

        if (!configContent) return;

        // Set initial state based on localStorage
        if (isCollapsed) {
          configContent.classList.remove("show");
          if (configHeader) {
            configHeader.classList.add("collapsed");
            configHeader.setAttribute("aria-expanded", "false");
          }
        }

        // Make visible now that state is set
        configContent.classList.add("collapse-ready");

        // Save state when toggled
        configContent.addEventListener("hidden.bs.collapse", function () {
          localStorage.setItem("configPanelCollapsed", "true");
        });

        configContent.addEventListener("shown.bs.collapse", function () {
          localStorage.setItem("configPanelCollapsed", "false");
        });
      }
    })();
  </script>
  <div
    class="docs-panel__header config-header"
    data-bs-toggle="collapse"
    data-bs-target="#configContent"
    aria-expanded="true"
    aria-controls="configContent"
  >
    <div>
      <h3 class="docs-panel__title">Configuration</h3>
      <p class="docs-panel__subtitle">The URL and credentials the examples on this page use</p>
    </div>
    <svg class="docs-panel__chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="collapse show" id="configContent">
    <div class="docs-panel__body">
      <div class="row g-3">
        <div class="col-md-3">
          <label>Client Type</label>
          <select
            x-model="clientType"
            @change="onClientTypeChange()"
            class="form-select"
          >
            <option value="all">Show All</option>
            <option value="curl">cURL</option>
            <option value="httpie">HTTPie</option>
            <option value="javascript">JavaScript</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>RESTHeart URL</label>
          <input
            type="text"
            x-model="instanceUrl"
            @input="onInputChange()"
            class="form-control"
            placeholder="https://your-service.ulabase.app"
          />
        </div>
        <div class="col-md-3">
          <label>Username</label>
          <input
            type="text"
            x-model="username"
            @input="onInputChange()"
            class="form-control"
            placeholder="your_username"
          />
        </div>
        <div class="col-md-3">
          <label>Password</label>
          <input
            type="text"
            style="text-security: disc; -webkit-text-security: disc"
            x-model="password"
            @input="onInputChange()"
            class="form-control"
            placeholder="your_password"
          />
        </div>
      </div>

      <div class="docs-panel__actions">
        <button type="button" @click="setLocalhostDefaults()" class="docs-panel__btn">Use localhost</button>
        <span class="docs-panel__hint">localhost:8080 with admin:secret</span>
        <span class="docs-panel__spacer"></span>
        <span class="docs-panel__hint">Saved in your browser</span>
        <button type="button" @click="clearValues()" class="docs-panel__btn">Clear</button>
      </div>
    </div>
  </div>
</div>
